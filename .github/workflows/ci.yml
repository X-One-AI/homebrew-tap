name: CI

on:
  push:
  pull_request:

jobs:
  test-formulae:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Update Homebrew
        run: brew update

      - name: Tap workspace
        run: brew tap x-one-ai/tap "$GITHUB_WORKSPACE"

      - name: Trust formula
        run: brew trust x-one-ai/tap

      - name: Audit formula
        run: brew audit --strict --online x-one-ai/tap/mcp-audit

      - name: Install formula from source
        run: brew install --build-from-source x-one-ai/tap/mcp-audit

      - name: Test formula
        run: brew test x-one-ai/tap/mcp-audit
